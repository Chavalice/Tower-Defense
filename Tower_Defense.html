<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Scratch Fullscreen</title>
    <style>
        /* Menghilangkan margin bawaan browser dan scrollbar luar */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000; /* Latar belakang hitam untuk area kosong */
        }

        /* Mengatur iframe agar memenuhi seluruh layar secara responsif */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Iframe proyek Scratch Anda dengan optimasi fullscreen -->
    <iframe src="https://scratch.mit.edu/projects/1396419796/embed" allowtransparency="true" scrolling="no" allowfullscreen></iframe>

</body>
</html>
